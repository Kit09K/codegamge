      <stop offset="0%" stop-color="#f39c12" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="gold-armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="steel-helm" x1="0" y1="0" x2="0" y2="1">
